name: run-cross-platform-container

on:
  workflow_dispatch:
  push:

jobs:
  qemu-example:
    runs-on: ubuntu-latest
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      -
        name: Run an arm64 container
        run: docker run --rm --platform linux/arm64 alpine uname -m
